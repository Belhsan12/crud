<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 transition-colors duration-300">
    <div class="container mx-auto px-4 py-8 max-w-2xl">
        <header class="text-center mb-10">
            <h1 class="text-4xl font-bold text-slate-800 dark:text-slate-50 mb-4">Get in Touch</h1>
            <p class="text-lg text-slate-600 dark:text-slate-300">We'd love to hear from you! Please fill out the form below.</p>
        </header>

        <div class="bg-white dark:bg-slate-900 rounded-xl shadow-lg border border-slate-200 dark:border-slate-800 p-8 md:p-10">
            <form id="contactForm" class="space-y-6">
                <div>
                    <label for="name" class="block text-sm font-medium text-slate-700 dark:text-slate-200 mb-2">Name <span class="text-red-500">*</span></label>
                    <div class="relative">
                        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 dark:text-slate-500">👤</span>
                        <input type="text" id="name" name="name" class="form-input pl-10" placeholder="Your Name" required>
                    </div>
                    <p id="nameError" class="text-red-500 text-sm mt-1 hidden">Name is required.</p>
                </div>

                <div>
                    <label for="email" class="block text-sm font-medium text-slate-700 dark:text-slate-200 mb-2">Email <span class="text-red-500">*</span></label>
                    <div class="relative">
                        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 dark:text-slate-500">📧</span>
                        <input type="email" id="email" name="email" class="form-input pl-10" placeholder="you@example.com" required>
                    </div>
                    <p id="emailError" class="text-red-500 text-sm mt-1 hidden">Please enter a valid email address.</p>
                </div>

                <div>
                    <label for="subject" class="block text-sm font-medium text-slate-700 dark:text-slate-200 mb-2">Subject <span class="text-red-500">*</span></label>
                    <div class="relative">
                        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 dark:text-slate-500">📝</span>
                        <input type="text" id="subject" name="subject" class="form-input pl-10" placeholder="Subject of your message" required>
                    </div>
                    <p id="subjectError" class="text-red-500 text-sm mt-1 hidden">Subject is required.</p>
                </div>

                <div>
                    <label for="message" class="block text-sm font-medium text-slate-700 dark:text-slate-200 mb-2">Message <span class="text-red-500">*</span></label>
                    <div class="relative">
                        <span class="absolute left-3 top-4 text-slate-400 dark:text-slate-500">💬</span>
                        <textarea id="message" name="message" rows="5" class="form-input pl-10 pt-4" placeholder="Your message..." required></textarea>
                    </div>
                    <p id="messageError" class="text-red-500 text-sm mt-1 hidden">Message is required.</p>
                </div>

                <button type="submit" class="btn-primary w-full">
                    Send Message
                </button>

                <div id="formMessage" class="mt-4 text-center text-sm font-medium hidden"></div>
            </form>
        </div>
    </div>

    <script src="js/contact-form.js"></script>
</body>
</html>
